<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>PSYC1505 社会印象更新研究</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f8f9fa; }
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        #app { background: white; width: 90%; max-width: 850px; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .hidden { display: none; }
        h1, h2 { color: var(--primary); text-align: center; }
        .instruction-box { background: #eef7ff; padding: 20px; border-left: 5px solid var(--accent); margin: 20px 0; line-height: 1.6; }
        .source-desc { display: flex; gap: 20px; margin: 20px 0; }
        .card { flex: 1; padding: 15px; border: 1px solid #ddd; border-radius: 8px; background: #fff; }
        .evidence-box { font-size: 28px; text-align: center; margin: 40px 0; padding: 30px; border: 2px dashed var(--accent); color: var(--primary); font-weight: bold; }
        .slider-wrap { margin: 50px 0; text-align: center; }
        input[type=range] { width: 100%; cursor: pointer; height: 8px; }
        .labels { display: flex; justify-content: space-between; margin-top: 10px; color: #7f8c8d; font-size: 0.9em; }
        .progress { text-align: center; color: #95a5a6; margin-bottom: 20px; }
        button { display: block; width: 200px; margin: 20px auto; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 25px; cursor: pointer; font-size: 16px; transition: 0.3s; }
        button:hover { background: var(--accent); transform: translateY(-2px); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 13px; }
        th, td { border: 1px solid #eee; padding: 10px; text-align: center; }
        th { background: #f4f4f4; }
    </style>
</head>
<body>

<div id="app">
    <div id="view-intro">
        <h1>PSYC1505 社交认知实验</h1>
        <p>欢迎参加本研究。你将通过不同信息源的评价来了解多位陌生的目标人物。</p>
        <div class="instruction-box">
            <strong>重要提示：</strong><br>
            请完全分别对待每一个试次，不要从其他试次中做任何推断 。<br>
            评价量表：0 = 完全不可靠，100 = 完全可靠 。
        </div>
        <div class="source-desc">
            <div class="card"><strong>评价者 A:</strong> 与目标共事超过一年，观察深入（高可靠)。</div>
            <div class="card"><strong>评价者 B:</strong> 仅在一次社交聚会有过短暂交谈（低可靠）。</div>
        </div>
        <button onclick="startExperiment()">开始正式实验</button>
    </div>

    <div id="view-test" class="hidden">
        <div class="progress" id="progress-text">试次 1 / 4</div>
        <h2 id="trial-target-name">目标人物 X</h2>
        <div class="evidence-box" id="evidence-text">加载中...</div>
        
        <div class="slider-wrap">
            <p>你当前对该人物的“可靠性”评分：<span id="current-val" style="font-weight:bold; color:var(--accent);">50</span></p>
            <input type="range" id="rating-slider" min="0" max="100" value="50" oninput="document.getElementById('current-val').innerText=this.value">
            <div class="labels"><span>0 (极不可靠)</span><span>50 (中立)</span><span>100 (极可靠)</span></div>
        </div>
        <button onclick="handleNext()">提交当前判断</button>
    </div>

    <div id="view-result" class="hidden">
        <h2>实验已完成</h2>
        <p>根据贝叶斯推断模型 [cite: 58, 59]，以下是你的判断与理性权衡预测的对比：</p>
        <div id="result-table"></div>
        <button onclick="location.reload()">重新开始</button>
    </div>
</div>

<script>
    // --- 1. 实验参数配置 ---
    const SOURCES = {
        A: { name: "评价者 A (高可靠)", precision: 0.8 }, // 精度 w [cite: 57]
        B: { name: "评价者 B (低可靠)", precision: 0.2 }
    };

    const TRIALS_CONFIG = {
        CONSISTENT_POS: { type: '一致(正)', sA: 85, sB: 80 },
        CONSISTENT_NEG: { type: '一致(负)', sA: 15, sB: 20 },
        CONFLICT_A_HIGH: { type: '冲突(A高)', sA: 90, sB: 20 },
        CONFLICT_B_HIGH: { type: '冲突(B高)', sA: 25, sB: 85 }
    };

    // --- 2. 拉丁方平衡设计 (4组)  ---
    const LATIN_SQUARE = [
        [{f:'A', c:'CONSISTENT_POS'}, {f:'B', c:'CONFLICT_A_HIGH'}, {f:'A', c:'CONSISTENT_NEG'}, {f:'B', c:'CONFLICT_B_HIGH'}],
        [{f:'B', c:'CONFLICT_A_HIGH'}, {f:'A', c:'CONSISTENT_NEG'}, {f:'B', c:'CONFLICT_B_HIGH'}, {f:'A', c:'CONSISTENT_POS'}],
        [{f:'A', c:'CONSISTENT_NEG'}, {f:'B', c:'CONFLICT_B_HIGH'}, {f:'A', c:'CONSISTENT_POS'}, {f:'B', c:'CONFLICT_A_HIGH'}],
        [{f:'B', c:'CONFLICT_B_HIGH'}, {f:'A', c:'CONSISTENT_POS'}, {f:'B', c:'CONFLICT_A_HIGH'}, {f:'A', c:'CONSISTENT_NEG'}]
    ];

    let currentGroup = Math.floor(Math.random() * 4);
    let mySequence = LATIN_SQUARE[currentGroup];
    let trialIdx = 0;
    let stepInTrial = 0; // 0=第一个评价, 1=第二个评价
    let rawData = [];

    // --- 3. 控制逻辑 ---
    function startExperiment() {
        document.getElementById('view-intro').classList.add('hidden');
        document.getElementById('view-test').classList.remove('hidden');
        updateUI();
    }

    function updateUI() {
        const trial = mySequence[trialIdx];
        const config = TRIALS_CONFIG[trial.c];
        const order = trial.f === 'A' ? ['A', 'B'] : ['B', 'A'];
        const currentSourceKey = order[stepInTrial];
        
        document.getElementById('progress-text').innerText = `试次 ${trialIdx + 1} / 4 (组别: ${currentGroup + 1})`;
        document.getElementById('trial-target-name').innerText = `目标人物：${String.fromCharCode(88 + trialIdx)}`; // X, Y, Z, W
        document.getElementById('evidence-text').innerText = `${SOURCES[currentSourceKey].name} 评价为：${currentSourceKey === 'A' ? config.sA : config.sB} 分`;
        document.getElementById('rating-slider').value = 50;
        document.getElementById('current-val').innerText = 50;
    }

    function handleNext() {
        const val = parseInt(document.getElementById('rating-slider').value);
        const trial = mySequence[trialIdx];
        const order = trial.f === 'A' ? ['A', 'B'] : ['B', 'A'];
        const sourceKey = order[stepInTrial];

        // 记录数据
        rawData.push({
            trialNum: trialIdx + 1,
            condType: TRIALS_CONFIG[trial.c].type,
            source: SOURCES[sourceKey].name,
            scoreProvided: sourceKey === 'A' ? TRIALS_CONFIG[trial.c].sA : TRIALS_CONFIG[trial.c].sB,
            userRating: val,
            isFinal: stepInTrial === 1
        });

        if (stepInTrial === 0) {
            stepInTrial = 1;
            updateUI();
        } else {
            if (trialIdx < 3) {
                alert("当前人物评价结束，准备进入下一个目标。");
                trialIdx++;
                stepInTrial = 0;
                updateUI();
            } else {
                showFinalResults();
            }
        }
    }

    function calculateBayesian(sA, sB) {
        const w0 = 1 / Math.pow(5, 2); // 先验精度 [cite: 56]
        const mu0 = 50;
        const wA = SOURCES.A.precision;
        const wB = SOURCES.B.precision;
        // 贝叶斯加权平均公式 
        return (w0 * mu0 + wA * sA + wB * sB) / (w0 + wA + wB);
    }

    function showFinalResults() {
        document.getElementById('view-test').classList.add('hidden');
        document.getElementById('view-result').classList.remove('hidden');

        let html = `<table><tr><th>试次</th><th>条件</th><th>第一印象</th><th>最终印象</th><th>贝叶斯预测值</th></tr>`;
        
        for (let i = 0; i < 4; i++) {
            const tData = rawData.filter(d => d.trialNum === i + 1);
            const trialConf = TRIALS_CONFIG[mySequence[i].c];
            const bayes = calculateBayesian(trialConf.sA, trialConf.sB);
            
            html += `<tr>
                <td>${i+1}</td>
                <td>${tData[0].condType}</td>
                <td>${tData[0].userRating}</td>
                <td>${tData[1].userRating}</td>
                <td>${bayes.toFixed(1)}</td>
            </tr>`;
        }
        html += `</table>`;
        document.getElementById('result-table').innerHTML = html;
    }
</script>
</body>
</html>
